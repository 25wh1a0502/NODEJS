<!DOCTYPE html>
<html>

    <title>E-Book Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>

    </nav>

<section class="catalog">

            <h3>Java Programming</h3>
            <p>Author: James Brown</p>
            <p class="price">₹499</p>

        </div>

        <div class="book-card">
            <div class="book-cover">PYTHON</div>
            <h3>Python Basics</h3>

            <p class="price">₹349</p>
